name: Courtside checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: courtside-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  full-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked build dependencies
        run: npm ci --no-audit --no-fund
      - name: Syntax validation
        run: npm run check:syntax
      - name: Node and architecture regressions
        run: npm test
      - name: Verify immutable 1.6.1 baseline
        run: npm run verify:baseline
      - name: Build standalone candidate
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python test syntax
        run: python -m compileall -q tests
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Offline Chromium browser regressions
        run: npm run test:browser
      - name: Verify local candidate (no Pages update)
        run: |
          npm run release:prepare
          npm run release:verify
          cmp dist/courtside.html courtside.html
      - name: Upload reviewable standalone HTML
        uses: actions/upload-artifact@v4
        with:
          name: courtside-candidate-${{ github.sha }}
          path: dist/courtside.html
          if-no-files-found: error
          retention-days: 30
