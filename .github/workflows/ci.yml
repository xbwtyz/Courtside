name: Courtside checks
on:
  push:
    branches:
      - refactor/modular-1.7
  pull_request:
permissions:
  contents: read
jobs:
  unit-and-parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: Run unit and build tests
        run: npm test
      - name: Verify unchanged standalone artifact
        run: npm run verify:baseline
      - name: Build modular pilot distributable
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Run offline Chromium smoke and legacy comparison
        run: npm run test:browser
      - name: Upload standalone development HTML
        uses: actions/upload-artifact@v4
        with:
          name: courtside-1.7-modular-dev-html
          path: dist/courtside.html
          if-no-files-found: error
