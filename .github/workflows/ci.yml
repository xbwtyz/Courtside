name: Courtside checks
on:
  push:
    branches:
      - refactor/modular-1.7
  pull_request:
permissions:
  contents: read
jobs:
  unit-and-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: Run unit and build tests
        run: npm test
      - name: Verify unchanged standalone artifact
        run: npm run verify:baseline
